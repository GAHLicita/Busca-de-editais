name: Busca diária de editais

on:
  schedule:
    # Todo dia às 06:47 (horário de Brasília) = 09:47 UTC.
    # O GitHub às vezes atrasa ou descarta execuções agendadas; os horários
    # seguintes são reservas e só consultam o PNCP se a busca do dia ainda
    # não tiver rodado (ver passo "Verificar se a busca de hoje já rodou").
    - cron: "47 9 * * *"
    - cron: "17 11 * * *"
    - cron: "17 13 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      abertos:
        description: "Buscar TODOS os editais com proposta ainda aberta (ignora os dias abaixo)"
        type: boolean
        default: false
      dias:
        description: "Quantos dias para trás consultar (padrão: 2)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: busca-editais
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          # versão mais recente do ramo (inclui o relatório de uma execução anterior do dia)
          ref: ${{ github.ref }}

      - name: Verificar se a busca de hoje já rodou
        id: hoje
        run: |
          arquivo="relatorios/$(TZ=America/Sao_Paulo date +%Y-%m-%d).md"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$arquivo" ]; then
            echo "Busca de hoje já feita ($arquivo); horário reserva não precisa rodar."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.hoje.outputs.pular != 'true'
        with:
          python-version: "3.12"

      - name: Consultar PNCP e gerar relatório
        id: busca
        if: steps.hoje.outputs.pular != 'true'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: |
          if [ "${{ github.event.inputs.abertos }}" = "true" ]; then
            python scripts/buscar_editais.py --abertos
          elif [ -n "${{ github.event.inputs.dias }}" ]; then
            python scripts/buscar_editais.py --dias "${{ github.event.inputs.dias }}"
          else
            python scripts/buscar_editais.py
          fi

      - name: Publicar relatório como issue
        if: always() && steps.busca.outputs.publicar == 'true' && hashFiles('dados/corpo_issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ASSUNTO: ${{ steps.busca.outputs.assunto }}
        run: |
          gh label create editais --color 1d76db --description "Relatório diário de editais" --force
          gh issue create --title "${ASSUNTO:-Relatório de editais}" --body-file dados/corpo_issue.md --label editais

      - name: Salvar relatório e histórico no repositório
        if: always() && steps.hoje.outputs.pular != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios dados/editais_vistos.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada para salvar."
          else
            git commit -m "Relatório de editais $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git pull --rebase --quiet
            git push
          fi

      - name: Sinalizar falha na consulta
        if: steps.busca.outcome == 'failure'
        run: |
          echo "::error::A consulta ao PNCP falhou. Veja o log do passo 'Consultar PNCP'."
          exit 1
